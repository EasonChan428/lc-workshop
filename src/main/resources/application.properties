server.port=8080

# 只监听本机回环地址：这个工具会读取本地文件系统，默认不对局域网/公网开放
# 想让同一局域网的其他设备访问（有风险，自己权衡），改成 0.0.0.0
server.address=127.0.0.1

# 题库根目录：留空则使用「上次在页面上选择的目录」，再退化为自动探测
# （当前目录下的 src/leetcode，否则用当前目录）
# 例：workshop.root=D:/my-leetcode/src/leetcode
# 也可以用环境变量 WORKSHOP_ROOT 指定
workshop.root=

# 启动后是否自动打开浏览器
workshop.open-browser=true

# 开发期禁用静态资源缓存，改完页面刷新即可看到
spring.web.resources.cache.period=0

logging.level.root=INFO
