<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题解工坊</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --line: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --tag-bg: #f1f5f9;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px; background: var(--bg); color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px;
        }
        header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        h1 { font-size: 20px; margin: 0; }
        .muted { color: var(--muted); }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
        .card .label { color: var(--muted); font-size: 12px; }
        .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
        .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
        .toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
        .toolbar.no-border { border-bottom: none; }
        input[type=text], input[type=search] { flex: 1 1 260px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; }
        input[type=text]:focus, input[type=search]:focus { border-color: var(--accent); }
        button { padding: 8px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); white-space: nowrap; }
        button:hover { border-color: var(--accent); color: var(--accent); }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        button.primary:hover { opacity: .9; color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fbfcfd; }
        tbody tr:hover { background: var(--accent-soft); }
        td.num { font-variant-numeric: tabular-nums; color: var(--muted); width: 64px; }
        td.topic { color: var(--muted); width: 110px; }
        .tag { display: inline-block; background: var(--tag-bg); border-radius: 6px; padding: 1px 7px; margin: 1px 4px 1px 0; font-size: 12px; color: #334155; }
        .tag.zh { background: #fff7ed; color: #9a3412; }
        .empty { padding: 24px; text-align: center; color: var(--muted); }
        #similarPanel { margin-top: 16px; display: none; }
        #similarHead { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .sim-row { display: flex; gap: 12px; padding: 8px 12px; align-items: baseline; flex-wrap: wrap; }
        .sim-row .shared { color: #9a3412; font-size: 12px; white-space: nowrap; }
        .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
        .badge.gray { background: var(--tag-bg); color: var(--muted); }
        /* 代码面板 */
        #codePanel { margin-top: 16px; display: none; }
        #codeHead { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        #codeHead .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .code-scroll { max-height: 60vh; overflow: auto; border-radius: 0 0 10px 10px; }
        .code-grid { display: grid; grid-template-columns: auto 1fr; min-width: min-content; }
        .code-gutter {
            position: sticky; left: 0; z-index: 1; padding: 12px 10px 12px 14px;
            text-align: right; color: #9ca3af; background: #fbfcfd; border-right: 1px solid var(--line);
            font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; line-height: 1.55;
            white-space: pre; user-select: none;
        }
        .code-area {
            margin: 0; padding: 12px 16px; white-space: pre; tab-size: 4;
            font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; line-height: 1.55;
        }
        .code-area .k { color: #7c3aed; }
        .code-area .s { color: #b45309; }
        .code-area .c { color: #15803d; font-style: italic; }
        .code-area .n { color: #0369a1; }
        .code-note { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
        td.actions { white-space: nowrap; }
        td.actions button { padding: 4px 10px; font-size: 13px; }
        footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
        /* 目录选择弹窗 */
        #dirModal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
        #dirModal.show { display: flex; }
        .modal-box { background: var(--card); border-radius: 12px; width: min(760px, 100%); max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .modal-path { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; word-break: break-all; background: #fbfcfd; }
        .modal-body { overflow: auto; flex: 1; }
        .dir-row { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-bottom: 1px solid #f1f3f5; cursor: pointer; }
        .dir-row:hover { background: var(--accent-soft); }
        .dir-row .name { flex: 1; word-break: break-all; }
        .dir-row .hint { font-size: 12px; color: #047857; background: #ecfdf5; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
        .modal-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
        .modal-foot .grow { flex: 1; font-size: 12px; color: var(--muted); align-self: center; }
    </style>
</head>
<body>

<header>
    <h1>题解工坊</h1>
    <span class="muted" id="rootPath">加载中…</span>
</header>

<div class="panel" style="margin-bottom:16px;">
    <div class="toolbar no-border">
        <span class="muted" style="white-space:nowrap;">题库目录</span>
        <input type="text" id="rootInput" placeholder="例如 D:/my-leetcode/src/leetcode">
        <button id="btnBrowse">浏览…</button>
        <button class="primary" id="btnApplyRoot">使用此目录</button>
        <button id="btnReload">重新扫描</button>
    </div>
</div>

<div class="cards">
    <div class="card"><div class="label">题目总数</div><div class="value" id="statTotal">-</div></div>
    <div class="card"><div class="label">已打标签</div><div class="value" id="statTagged">-</div></div>
    <div class="card"><div class="label">标签覆盖率</div><div class="value" id="statCoverage">-</div></div>
    <div class="card"><div class="label">未打标签</div><div class="value" id="statUntagged">-</div></div>
</div>

<div class="muted" style="font-size:12px;">主题分布（点一下可筛选）</div>
<div class="chips" id="topicChips"></div>

<div class="muted" style="font-size:12px;">标签（点一下可检索）</div>
<div class="chips" id="tagChips"></div>

<div class="panel">
    <div class="toolbar">
        <input type="search" id="keyword" placeholder="按题号 / 标题 / 主题 / 标签检索，例如 322、perfect、完全背包">
        <button class="primary" id="btnSearch">搜索</button>
        <button id="btnClear">清空</button>
    </div>
    <table>
        <thead>
        <tr><th>题号</th><th>主题</th><th>标题</th><th>标签</th><th>相似题</th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyHint" style="display:none;">没有匹配的题目</div>
</div>

<div class="panel" id="codePanel">
    <div id="codeHead">
        <div class="meta">
            <span class="badge">代码</span>
            <strong id="codeTitle"></strong>
            <span class="muted" id="codeFile"></span>
            <span id="codeTags"></span>
        </div>
        <div class="meta">
            <button id="btnAiTags">AI 建议标签</button>
            <button id="btnCopyCode">复制代码</button>
            <button id="btnCloseCode">关闭</button>
        </div>
    </div>
    <div class="code-scroll">
        <div class="code-grid">
            <div class="code-gutter" id="codeGutter"></div>
            <pre class="code-area"><code id="codeArea"></code></pre>
        </div>
    </div>
    <div class="code-note" id="codeNote" style="display:none;"></div>
    <div id="aiBox" style="display:none; border-top:1px solid var(--line); padding:12px;">
        <div class="muted" style="font-size:12px; margin-bottom:8px;" id="aiHint"></div>
        <div class="chips" id="aiChips" style="margin:0 0 10px;"></div>
        <div class="meta" style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="primary" id="btnApplyTags">写回文件</button>
            <button id="btnCancelAi">取消</button>
            <span class="muted" id="aiStatus" style="font-size:12px; align-self:center;"></span>
        </div>
    </div>
</div>

<div class="panel" id="similarPanel">
    <div id="similarHead">
        <div><span class="badge" id="similarBadge">相似题</span> <strong id="similarTitle"></strong></div>
        <button id="btnCloseSimilar">关闭</button>
    </div>
    <div id="similarBody"></div>
</div>

<footer>数据来自 <code>/api/problems</code>、<code>/api/stats</code>；改完题库点「重新扫描」。</footer>

<!-- 目录选择弹窗 -->
<div id="dirModal">
    <div class="modal-box">
        <div class="modal-head">
            <strong>选择题库目录</strong>
            <button id="btnCloseModal">关闭</button>
        </div>
        <div class="modal-path" id="modalPath">—</div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot">
            <span class="grow" id="modalHint"></span>
            <button id="btnUseCurrent">使用「当前目录」</button>
        </div>
    </div>
</div>

<script>
    const state = { keyword: "", topic: "", currentDir: "" };

    async function getJson(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(url + " -> " + resp.status);
        return resp.json();
    }

    function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
    }

    function tagSpan(text) {
        const isZh = /[\u4e00-\u9fa5]/.test(text);
        return el("span", isZh ? "tag zh" : "tag", text);
    }

    async function loadStats() {
        const s = await getJson("/api/stats");
        document.getElementById("statTotal").textContent = s.total;
        document.getElementById("statTagged").textContent = s.tagged;
        document.getElementById("statCoverage").textContent = s.coveragePercent + "%";
        document.getElementById("statUntagged").textContent = s.untagged;

        const topicBox = document.getElementById("topicChips");
        topicBox.innerHTML = "";
        Object.entries(s.byTopic).forEach(([topic, count]) => {
            const chip = el("span", "chip", topic + " · " + count);
            chip.onclick = () => {
                state.topic = (state.topic === topic ? "" : topic);
                state.keyword = "";
                document.getElementById("keyword").value = "";
                loadProblems();
            };
            topicBox.appendChild(chip);
        });

        const tagBox = document.getElementById("tagChips");
        tagBox.innerHTML = "";
        Object.entries(s.tagFrequency).forEach(([tag, count]) => {
            const chip = el("span", "chip", tag + " · " + count);
            chip.onclick = () => {
                state.topic = "";
                state.keyword = tag;
                document.getElementById("keyword").value = tag;
                loadProblems();
            };
            tagBox.appendChild(chip);
        });
    }

    async function loadProblems() {
        const q = state.topic || state.keyword;
        const data = await getJson("/api/problems?q=" + encodeURIComponent(q));

        document.getElementById("rootPath").textContent = "题库：" + data.root;
        if (document.activeElement !== document.getElementById("rootInput")) {
            document.getElementById("rootInput").value = data.root;
        }

        const tbody = document.getElementById("rows");
        tbody.innerHTML = "";
        const list = state.topic ? data.problems.filter(p => p.topic === state.topic) : data.problems;

        list.forEach(p => {
            const tr = el("tr");
            tr.appendChild(el("td", "num", p.number));
            tr.appendChild(el("td", "topic", p.topic));
            tr.appendChild(el("td", null, p.title));

            const tagTd = el("td");
            if (p.tags.length === 0) {
                tagTd.appendChild(el("span", "muted", "—"));
            } else {
                p.tags.forEach(t => tagTd.appendChild(tagSpan(t)));
            }
            tr.appendChild(tagTd);

            const actionTd = el("td", "actions");
            const codeBtn = el("button", null, "代码");
            codeBtn.onclick = () => showCode(p);
            actionTd.appendChild(codeBtn);
            const simBtn = el("button", null, "推荐");
            simBtn.style.marginLeft = "6px";
            simBtn.onclick = () => showSimilar(p.number);
            actionTd.appendChild(simBtn);
            tr.appendChild(actionTd);

            tbody.appendChild(tr);
        });

        const hint = document.getElementById("emptyHint");
        hint.style.display = list.length === 0 ? "block" : "none";
        hint.textContent = (list.length === 0 && data.total === 0)
            ? "题库为空：当前扫描目录是 " + data.root + "。点上方「浏览…」选择你的题库目录。"
            : "没有匹配的题目";
    }

    async function showSimilar(number) {
        const data = await getJson("/api/problems/" + number + "/similar");
        const panel = document.getElementById("similarPanel");
        panel.style.display = "block";

        const badge = document.getElementById("similarBadge");
        badge.textContent = { tags: "共享标签", topic: "同主题（该题还未打标签）", none: "无推荐" }[data.reason] || data.reason;
        badge.className = "badge" + (data.reason === "tags" ? "" : " gray");
        document.getElementById("similarTitle").textContent = data.target.number + " · " + data.target.title;

        const body = document.getElementById("similarBody");
        body.innerHTML = "";
        if (data.items.length === 0) {
            body.appendChild(el("div", "empty", "没有找到相似题"));
        } else {
            data.items.forEach(item => {
                const row = el("div", "sim-row");
                row.appendChild(el("span", "num", String(item.problem.number)));
                row.appendChild(el("span", "muted", item.problem.topic));
                row.appendChild(el("span", null, item.problem.title));
                if (item.sharedTags > 0) row.appendChild(el("span", "shared", "共享 " + item.sharedTags + " 个标签"));
                item.problem.tags.forEach(t => row.appendChild(tagSpan(t)));
                body.appendChild(row);
            });
        }
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // ==================== 代码查看（只读） ====================

    const JAVA_TOKEN = /\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|\b(?:public|private|protected|static|final|abstract|class|interface|record|enum|extends|implements|void|int|long|short|byte|char|boolean|double|float|if|else|for|while|do|switch|case|default|return|new|this|super|null|true|false|break|continue|try|catch|finally|throw|throws|import|package|instanceof)\b|\b\d+\b/g;

    function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /** 极简 Java 高亮：注释/字符串/关键字/数字。先切词再转义，避免 XSS 与误替换。 */
    function highlightJava(code) {
        let out = "", last = 0, m;
        JAVA_TOKEN.lastIndex = 0;
        while ((m = JAVA_TOKEN.exec(code)) !== null) {
            out += escHtml(code.slice(last, m.index));
            const token = m[0];
            let cls = "k";
            if (token.startsWith("//") || token.startsWith("/*")) cls = "c";
            else if (token.startsWith("\"") || token.startsWith("'")) cls = "s";
            else if (/^\d+$/.test(token)) cls = "n";
            out += '<span class="' + cls + '">' + escHtml(token) + '</span>';
            last = m.index + token.length;
        }
        out += escHtml(code.slice(last));
        return out;
    }

    let currentCode = "";

    async function showCode(problem) {
        let data;
        try {
            data = await getJson("/api/problems/" + problem.number + "/code");
        } catch (e) {
            alert("读取源码失败：" + e.message);
            return;
        }
        currentCode = data.code;
        currentProblem = problem;
        document.getElementById("aiBox").style.display = "none";
        document.getElementById("aiStatus").textContent = "";

        document.getElementById("codeTitle").textContent = problem.number + " · " + problem.title;
        document.getElementById("codeFile").textContent = data.fileName;

        const tagBox = document.getElementById("codeTags");
        tagBox.innerHTML = "";
        problem.tags.forEach(t => tagBox.appendChild(tagSpan(t)));

        document.getElementById("codeArea").innerHTML = highlightJava(data.code);

        const lines = data.code.split("\n").length;
        let gutter = "";
        for (let i = 1; i <= lines; i++) gutter += i + "\n";
        document.getElementById("codeGutter").textContent = gutter;

        const note = document.getElementById("codeNote");
        if (data.truncated) {
            note.style.display = "block";
            note.textContent = "文件较大，只显示了前 " + data.code.length + " 个字符。";
        } else {
            note.style.display = "none";
        }

        const panel = document.getElementById("codePanel");
        panel.style.display = "block";
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("btnCopyCode").onclick = async () => {
        const btn = document.getElementById("btnCopyCode");
        try {
            await navigator.clipboard.writeText(currentCode);
            const old = btn.textContent;
            btn.textContent = "已复制 ✓";
            setTimeout(() => { btn.textContent = old; }, 1200);
        } catch (e) {
            alert("复制失败（浏览器不允许），可以手动选中代码复制。");
        }
    };
    document.getElementById("btnCloseCode").onclick = () => {
        document.getElementById("codePanel").style.display = "none";
    };

    // ==================== AI 建议标签 ====================

    let currentProblem = null;
    let aiSuggested = [];

    document.getElementById("btnAiTags").onclick = () => suggestTags();
    document.getElementById("btnCancelAi").onclick = () => {
        document.getElementById("aiBox").style.display = "none";
    };
    document.getElementById("btnApplyTags").onclick = () => applyTags();

    async function suggestTags() {
        if (!currentProblem) return;
        const box = document.getElementById("aiBox");
        const hint = document.getElementById("aiHint");
        const chips = document.getElementById("aiChips");
        const status = document.getElementById("aiStatus");

        box.style.display = "block";
        chips.innerHTML = "";
        status.textContent = "";
        hint.textContent = "正在调用模型分析这道题的解法……（需要几秒）";

        try {
            const resp = await fetch("/api/ai/suggest-tags/" + currentProblem.number, { method: "POST" });
            const data = await resp.json();
            if (!resp.ok) {
                hint.textContent = "AI 调用失败：" + (data.error || resp.status);
                hint.style.color = "#b91c1c";
                return;
            }
            hint.style.color = "";
            aiSuggested = data.suggestions || [];
            if (aiSuggested.length === 0) {
                hint.textContent = "模型没有给出可用标签（可以重试或手动添加）。";
                return;
            }
            hint.textContent = "AI 建议（点击可取消选择）· 当前已有标签：" +
                ((data.currentTags || []).join("、") || "无");
            aiSuggested.forEach(tag => {
                const chip = el("span", "chip", tag);
                chip.style.borderColor = "var(--accent)";
                chip.style.color = "var(--accent)";
                chip.dataset.selected = "1";
                chip.onclick = () => {
                    const on = chip.dataset.selected === "1";
                    chip.dataset.selected = on ? "0" : "1";
                    chip.style.borderColor = on ? "" : "var(--accent)";
                    chip.style.color = on ? "" : "var(--accent)";
                    chip.style.opacity = on ? "0.45" : "1";
                };
                chips.appendChild(chip);
            });
        } catch (e) {
            hint.textContent = "AI 调用异常：" + e.message;
            hint.style.color = "#b91c1c";
        }
    }

    async function applyTags() {
        if (!currentProblem) return;
        const selected = Array.from(document.querySelectorAll("#aiChips .chip"))
            .filter(c => c.dataset.selected === "1")
            .map(c => c.textContent);
        const status = document.getElementById("aiStatus");
        if (selected.length === 0) {
            status.textContent = "至少要选一个标签";
            return;
        }
        status.textContent = "写入中…";
        try {
            const resp = await fetch("/api/ai/apply-tags/" + currentProblem.number, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tags: selected })
            });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = "写入失败：" + (data.error || resp.status);
                return;
            }
            status.textContent = data.changed
                ? "已写入（备份：" + (data.backup || "").split("\\").pop() + "）"
                : "内容无变化，未写入";
            await loadStats();
            await loadProblems();
            // 重新打开一次，显示更新后的标签
            const updated = (await getJson("/api/problems?q=" + currentProblem.number)).problems[0];
            if (updated) showCode(updated);
        } catch (e) {
            status.textContent = "写入异常：" + e.message;
        }
    }

    // ==================== 目录选择 ====================

    function openDirModal() {
        document.getElementById("dirModal").classList.add("show");
        const current = document.getElementById("rootInput").value.trim()
            || document.getElementById("rootPath").textContent.replace(/^题库：/, "");
        browseTo(current);
    }

    async function browseTo(path) {
        const body = document.getElementById("modalBody");
        const pathLabel = document.getElementById("modalPath");
        const hint = document.getElementById("modalHint");
        body.innerHTML = "";
        body.appendChild(el("div", "empty", "加载中…"));

        try {
            let listing;
            if (!path) {
                const roots = await getJson("/api/roots");
                renderRoots(roots);
                return;
            }
            listing = await getJson("/api/dirs?path=" + encodeURIComponent(path));
            state.currentDir = listing.path;
            pathLabel.textContent = listing.path;
            hint.textContent = listing.looksLikeLeetCode ? "✔ 这个目录看起来就是题库" : "";
            document.getElementById("btnUseCurrent").textContent = "使用「" + listing.path + "」";

            body.innerHTML = "";
            if (listing.parent) {
                const up = el("div", "dir-row");
                up.appendChild(el("span", "name", "⬆ 上一级"));
                up.onclick = () => browseTo(listing.parent);
                body.appendChild(up);
            }
            if (listing.dirs.length === 0) {
                body.appendChild(el("div", "empty", "这个目录下没有子目录"));
            }
            listing.dirs.forEach(d => {
                const row = el("div", "dir-row");
                row.appendChild(el("span", "name", d.name));
                if (d.looksLikeLeetCode) row.appendChild(el("span", "hint", "像题库"));
                row.onclick = () => browseTo(d.path);
                body.appendChild(row);
            });
        } catch (e) {
            body.innerHTML = "";
            const rootBar = el("div", "empty", "无法读取该目录：" + e.message + "，换个位置试试。");
            body.appendChild(rootBar);
            const rootBtn = el("button", "primary", "从常见入口重新选择");
            rootBtn.style.margin = "0 auto 20px";
            rootBtn.onclick = () => browseTo("");
            body.appendChild(rootBtn);
        }
    }

    function renderRoots(roots) {
        const body = document.getElementById("modalBody");
        document.getElementById("modalPath").textContent = "从常见位置开始：";
        document.getElementById("modalHint").textContent = "";
        body.innerHTML = "";
        roots.forEach(r => {
            const row = el("div", "dir-row");
            row.appendChild(el("span", "name", r.name + "   " + r.path));
            if (r.looksLikeLeetCode) row.appendChild(el("span", "hint", "像题库"));
            row.onclick = () => browseTo(r.path);
            body.appendChild(row);
        });
    }

    async function applyRoot(path) {
        const resp = await fetch("/api/root", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: path })
        });
        const data = await resp.json();
        if (!resp.ok) {
            alert("切换失败：" + (data.error || resp.status));
            return;
        }
        document.getElementById("dirModal").classList.remove("show");
        state.topic = "";
        state.keyword = "";
        document.getElementById("keyword").value = "";
        await loadStats();
        await loadProblems();
    }

    document.getElementById("btnSearch").onclick = () => {
        state.topic = "";
        state.keyword = document.getElementById("keyword").value.trim();
        loadProblems();
    };
    document.getElementById("keyword").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("btnSearch").click();
    });
    document.getElementById("btnClear").onclick = () => {
        state.keyword = ""; state.topic = "";
        document.getElementById("keyword").value = "";
        loadProblems();
    };
    document.getElementById("btnReload").onclick = async () => {
        await fetch("/api/reload", { method: "POST" });
        await loadStats();
        await loadProblems();
    };
    document.getElementById("btnCloseSimilar").onclick = () => {
        document.getElementById("similarPanel").style.display = "none";
    };
    document.getElementById("btnBrowse").onclick = openDirModal;
    document.getElementById("btnCloseModal").onclick = () => {
        document.getElementById("dirModal").classList.remove("show");
    };
    document.getElementById("btnUseCurrent").onclick = () => {
        if (state.currentDir) applyRoot(state.currentDir);
    };
    document.getElementById("btnApplyRoot").onclick = () => {
        const path = document.getElementById("rootInput").value.trim();
        if (path) applyRoot(path);
    };
    document.getElementById("rootInput").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("btnApplyRoot").click();
    });

    (async () => {
        try {
            await loadStats();
            await loadProblems();
        } catch (e) {
            document.getElementById("rootPath").textContent = "加载失败：" + e.message;
        }
    })();
</script>
</body>
</html>
